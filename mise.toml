[tools]
action-validator = "latest"
actionlint = "latest"
# cobo manages the cobo-sealed .gitignore block; `mise install` provides it so
# the documented `cobo update && cobo sync` regeneration (and `cobo check`)
# works from a fresh checkout. Delivered via the pipx backend (a PyPI package).
"pipx:cobo" = "latest"
cookiecutter = "latest"
copier = "latest"
editorconfig-checker = "latest"
ghalint = "latest"
prek = "latest"
taplo = "latest"
typos = "latest"
uv = "latest"
yamlfmt = "latest"
yamllint = "latest"


# Every task below renders through tools/render.py — the single render
# entrypoint (ADR-031). Do not add a task that calls `copier copy` directly.
[tasks.example]
description = "Generate an example project from the template"
run = "uv run tools/render.py render example"

[tasks.regenerate]
description = "Rewrite the committed derived artifacts (docs/generated-project-trees.md)"
run = "uv run tools/render.py regenerate"

[tasks.watch]
description = "Re-render a scratch project into .watch-render/ on every template change"
run = "uv run --with watchfiles tools/render.py watch"

[tasks.test]
description = "Run the render-and-inspect harness (ADR-024)"
run = "uv run --with pytest --with pytest-regressions --with copier pytest tests/"

[tasks.test-golden-update]
description = "Regenerate the golden-file snapshots (review the diff before committing)"
run = "uv run --with pytest --with pytest-regressions --with copier pytest tests/test_golden_files.py --force-regen"
