---
name: Template CI
"on":
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    name: Render & test (${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # Bare template — only the always-on core/utils modules, and the
          # `library` bracket of the generate-and-run guard (issue #183). The
          # preset is spelled out rather than inherited from the data-file so
          # the bracket survives an edit to .example-input.yml; examples/ is
          # turned back off to keep a true core-only render (the `full-preset`
          # scenario below covers it, since `full` seeds include_examples).
          - name: minimal
            data: --data preset=library --data include_examples=false
          # The `full` preset itself — the other bracket of the generate-and-run
          # guard (issue #183): `minimal` is the bare `library` shape, this is
          # every toggle `preset_map` seeds (ADR-016), with the two axis picks
          # (web framework, broker) the preset leaves to a follow-up question.
          # Spelled as the preset, not a hand-listed toggle set, so a component
          # added to `full` is covered here without editing this matrix.
          - name: full-preset
            data: >-
              --data preset=full --data web_framework=fastapi --data worker_broker=redis
          # The ai-rulez shape (ADR-035): the `.ai-rulez/` sources replace
          # AGENTS.md/CLAUDE.md, and `ai-rulez generate` writes the per-host
          # files. A console root plus one sibling interface so the generated
          # package-structure rule renders its conditional rows and both of its
          # layering paragraphs. `full-preset` also enables the toggle, but only
          # this scenario runs the generator (see the convergence step below).
          #
          # *Every* offered host, not the three defaults: the convergence gate is
          # only as wide as the output it sees, and the defaults happen to emit
          # markdown alone. `cursor` (`.mdc`) and `continue-dev` (YAML) are the
          # two that ever produced output the generated project's own gates
          # rejected, so leaving them out is what let that ship.
          - name: ai-rulez
            data: >-
              --data include_ai_rulez=true --data include_cli=true --data include_mcp=true --data 'ai_rulez_presets=[claude,codex,copilot,cursor,gemini,windsurf,cline,continue-dev,amp,junie,opencode,hermes,antigravity]'
          # Exercise the other web framework and broker branches.
          - name: litestar-kafka
            data: >-
              --data include_web=true --data web_framework=litestar --data include_worker=true --data worker_broker=kafka
          # Compiles the Cython extension during the wheel build.
          - name: c-extensions
            data: --data include_c_extensions=true
          # Standalone-executable toggles (ADR-007), exercised independently and
          # combined the way worker_broker is. These render the .spec, the mise
          # tasks, the tool-group deps, and the build-* release jobs so style
          # (validate-pyproject, taplo, actionlint) lints them — the heavy
          # nuitka/pyinstaller/pycrucible deps live in the `tool` group, which
          # only the `profile` env installs, so they are not pulled here.
          # include_cli so the CLI-gated "Smoke-run" build-check steps in ci.yml
          # render and get actionlint-ed (the smoke step is identical across tools).
          - name: launcher
            data: --data include_launcher=true --data include_cli=true
          - name: freezer
            data: --data include_freezer=true
          - name: compiler
            data: --data include_compiler=true
          # All three at once + a GUI, to cover the combined needs-wiring and the
          # GUI-specific branches (spec console=False, Nuitka per-OS window flags).
          - name: executables-gui
            data: >-
              --data include_launcher=true --data include_freezer=true --data include_compiler=true --data include_gui=true
          # A server component (web) behind a freezer, so the non-CLI, non-GUI
          # entrypoint path (__main__ dispatches to web.app:main) is render-checked
          # against the .spec/freeze wiring — the build-* smoke step stays gated on
          # include_cli, so this only validates rendering, not a binary launch.
          - name: web-freezer
            data: --data include_web=true --data web_framework=fastapi --data include_freezer=true
          # The external-integration and repo-settings toggles no other scenario
          # renders (.cspell.yml, .mega-linter.yml, settings.yml, ruleset-sync.yml,
          # the homebrew/scoop dispatch workflows), with an explicitly non-ASCII
          # author so the .cspell.yml author tokens stay guarded (issue #213)
          # whatever .example-input.yml's own name happens to be.
          - name: integrations
            data: >-
              --data include_cli=true --data include_megalinter=true --data include_repo_settings=true --data include_repo_ruleset=true --data include_homebrew=true --data include_scoop=true --data include_all_contributors=true --data include_sourcery=true --data include_sonarcloud=true --data include_smokeshow=true --data author_full_name="Ada Löveláce"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # hatch-vcs (in generated projects) and copier --vcs-ref=HEAD need
          # full history and tags.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Render template
        # tools/render.py is the single render entrypoint (ADR-031) — the same
        # module the pytest harness, the committed docs artifacts, and the
        # authoring watch loop call, so this matrix cannot render a shape no
        # other consumer can reproduce. `uv run` resolves copier from the
        # script's PEP 723 metadata without mise; the later `uv run` steps
        # execute in ../rendered, where a mise shim would not resolve the repo's
        # tools.
        run: >
          uv run tools/render.py render ../rendered ${{ matrix.scenario.data }}

      - name: Audit rendered workflows with zizmor
        # The template's workflows are *.jinja and cannot be scanned directly, so
        # audit their rendered form here using the generated project's OWN zizmor
        # prek hook — the exact gate a generated repo runs in CI (the same
        # zizmor version, not a bare `uvx zizmor` that may pin a different one).
        # Across the matrix this exercises every conditional workflow branch
        # (web/worker/executables/...). prek operates on git-tracked files, and
        # the template defines no copier tasks (ADR-015) so the rendered tree is
        # not a git repo — init it, then stage it first.
        working-directory: ../rendered
        run: |
          git init -q
          git add -A
          # Fail loudly if the render produced no workflows: prek runs a hook only
          # against matching tracked files and, on zero matches, prints
          # "no files to check ... Skipped" and exits 0 — which would turn this
          # gate into a green no-op if the render ever stopped emitting workflows.
          if [ "$(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' | wc -l)" -eq 0 ]; then
            echo "::error::no rendered workflows staged for zizmor to audit"
            exit 1
          fi
          uv run --group prek prek run zizmor --all-files --show-diff-on-failure
      - name: Verify rendered files are formatter-canonical
        # A generated file shipped in a form the generated project's OWN fixing
        # hooks would rewrite fails that project's `hooks` CI job on its very
        # first push, and shows up as spurious drift on every `copier update`.
        # Nothing else here catches that: the zizmor step above and `tox -e
        # style` below run only *checking* tools (ADR-024's render harness
        # asserts rendered YAML is parseable, not canonical). See issue #213.
        #
        # Runs the rendered project's own fixing hooks, then asserts the
        # worktree is unchanged — `git diff`, not the hooks' exit codes, is the
        # gate, because a fixing hook that silently rewrites a file and still
        # exits 0 would sail through an exit-code-only check. Same shape as the
        # zizmor step above: these hooks are `builtin` or the yamlfmt binary, so
        # nothing has to install the generated project. The remaining fixers are
        # covered by `tox -e style` in check mode (ruff-format --check, taplo
        # --check). Relies on the `git init`/`git add -A` done above.
        working-directory: ../rendered
        run: |
          for hook in yamlfmt end-of-file-fixer trailing-whitespace; do
            uv run --group prek prek run "$hook" --all-files --show-diff-on-failure
          done
          git diff --exit-code
      - name: Generate the agent instruction files and verify they converge
        # The generated project ships `.ai-rulez/` sources; the host files
        # (AGENTS.md, CLAUDE.md, .github/copilot-instructions.md, the per-host
        # copies of the repo-setup skill) are build output, so nothing in the
        # render can be inspected for them — they exist only after a generate.
        #
        # Two generators write into the same tree here: ai-rulez, and the
        # project's own fixing hooks. If they disagree on a single byte the
        # repository never converges — every `prek run` rewrites what the last
        # `ai-rulez generate` wrote, and back. Prove they agree the same way the
        # formatter-canonical step above does: run the fixers over the generated
        # output and gate on `git diff`, not on hook exit codes (ADR-030/035).
        if: matrix.scenario.name == 'ai-rulez'
        working-directory: ../rendered
        run: |
          uv run --group agents ai-rulez generate
          # Newly generated files are untracked, and `git diff` ignores those.
          git add -A
          for hook in yamlfmt end-of-file-fixer trailing-whitespace markdownlint-cli2 typos; do
            uv run --group prek prek run "$hook" --all-files --show-diff-on-failure
          done
          git diff --exit-code
          # The *checking* hooks rewrite nothing, so `git diff` cannot speak for
          # them — gate on their exit codes instead. A checking hook that rejects
          # generated output is worse than a non-convergent fixing one: the only
          # edit that would satisfy it is erased by the next `generate`, so the
          # failure is unfixable (the `.copier-answers.yml` shape). `ec` is not
          # listed because the `Style checks` step below runs it (ADR-003).
          for hook in check-json yamllint; do
            uv run --group prek prek run "$hook" --all-files
          done
      - name: Style checks
        working-directory: ../rendered
        run: uv run tox run -e style
      - name: Tests
        working-directory: ../rendered
        run: uv run tox run -e 3.12
      - name: Verify Cython extension is built and importable
        # The package __init__ swallows a missing-extension ImportError with a
        # warning, and the generated test_c_extension uses importorskip, so a
        # build hook that silently produces no .so would still pass green. Build
        # a wheel and import the compiled symbol to fail loudly if it doesn't.
        if: matrix.scenario.name == 'c-extensions'
        working-directory: ../rendered
        run: |
          uv build --wheel
          wheels=(dist/*.whl)
          uv run --no-project --with "${wheels[0]}" python -c \
            "from example._c_extension import fibonacci_cython; assert fibonacci_cython(10) == 55"
      - name: Verify standalone executables get unique per-tool/per-OS names
        # template-ci does not build the binaries (the heavy nuitka/pyinstaller/
        # pycrucible deps live in the `tool` group), so assert at the render level
        # that each build job names its artifact <pkg>-<tool>-<label>. Bare
        # ./dist/ paths would let merge-multiple silently overwrite same-named
        # binaries across tools/OSes and drop platforms from the release (ADR-007).
        if: matrix.scenario.name == 'executables-gui'
        working-directory: ../rendered
        run: |
          wf=.github/workflows/release.yml
          # Require each tool's binary name to be OS-qualified: the "example-<tool>-"
          # prefix and a matrix.label reference on the same line. Asserting the
          # label qualifier (not just the prefix) is what pins per-OS uniqueness —
          # a hardcoded "example-<tool>-linux" or a bare prefix would pass a plain
          # substring check but still collide under merge-multiple. (The artifact
          # name uses "example-executable-<tool>-" and won't match.)
          for tool in launcher freezer compiler; do
            grep -Eq "example-${tool}-.*matrix\.label" "$wf" \
              || { echo "::error::release.yml does not name the ${tool} artifact uniquely per OS (missing matrix.label qualifier)"; exit 1; }
          done
  hooks:
    name: Run prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Run prek hooks
        # THIS repo's own hook suite, over its own files — distinct from the
        # `render` job's `prek run zizmor`, which audits the *rendered* project's
        # workflows. Until this job existed, `zizmor` was the only hook that ever
        # ran in CI, so every formatter hook was effectively unenforced: two
        # defects sat on main undetected, one of them non-idempotent (yamlfmt
        # appended a blank line to copier.yml on every run, without bound).
        #
        # `--all-files` because the point is a whole-repo invariant, not a
        # diff-scoped check: formatter churn hides in files a given PR never
        # touches. `--show-diff-on-failure` prints what a formatter hook changed,
        # so a failure is actionable from the log alone.
        #
        # uvx, not mise: every hook in prek.toml comes from `builtin` or an
        # upstream repo, so prek provisions its own hook environments (including
        # the node one for markdownlint) and the only tool CI needs is prek
        # itself. mise.toml stays the source of truth for local dev.
        run: uvx prek run --all-files --show-diff-on-failure
  render-tests:
    name: Render harness (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Copier renders from a git ref, so it needs the repo's history.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Run render harness
        # No root Python project (tooling is mise-managed), so the harness deps
        # come from an ephemeral uv env. It renders the template into tmp dirs
        # and asserts preset behavior, YAML/TOML validity across presets, and
        # golden-file snapshots of key rendered artifacts (ADR-024). pytest-
        # regressions provides the file_regression fixture; yaml is pulled in
        # transitively by copier.
        run: >-
          uv run --with pytest --with pytest-regressions --with copier pytest tests/ -v
