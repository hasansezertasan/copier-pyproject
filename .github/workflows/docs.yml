name: docs

# Documentation site on GitHub Pages: docs/, README.md as the home page and
# context/ as "Why it is built this way" (mkdocs.yml), plus the Keep the Why
# dashboard on /dashboard/live/ — context/ with its Git history, the live
# badges and state.json. Pull requests that touch any of it build only, as a
# check; a push to main (or a manual run) builds and deploys. Pages must be
# set to "GitHub Actions" as its source (Settings → Pages → Build and
# deployment → Source).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "context/**"
      - "README.md"
      - "mkdocs.yml"
      - "tools/mkdocs/**"
      - ".keep-the-why"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the dashboard dates entries by Git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the documentation into site/
        run: |
          pip install --quiet "mkdocs>=1.6.1,<2" "mkdocs-material>=9.7"
          mkdocs build --strict
      - name: Export the Keep the Why dashboard into site/dashboard/live
        run: |
          pip install --quiet keep-the-why-dashboard
          ktw-dashboard --export site/dashboard/live .
          test -s site/dashboard/live/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
