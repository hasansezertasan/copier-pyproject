---
name: Release
# Versions the copier-pyproject template itself (ADR-014). release-please opens
# and maintains a release PR from the Conventional Commits that land on `main`;
# on merge it tags the commit (v0.1.0, …) and cuts a GitHub Release. Those tags
# are what generated projects' `copier update` walks to — no build/publish jobs
# because the template is not a distributable package.
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions: {}
jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write  # IMPORTANT: release-please manages PR labels via the Issues API
      pull-requests: write
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
