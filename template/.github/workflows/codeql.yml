---
name: "CodeQL"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "21 21 * * 4"
jobs:
  analyze:
    name: Analyze
    # Code scanning needs GitHub Advanced Security on private repos; without it
    # every run gets a permanent red X. Free on public repos, so skip elsewhere.
    # `github.repository_visibility` (not the event payload) so the `schedule`
    # trigger resolves it too.
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/linters/.codeql.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          category: "/language:${{ matrix.language }}"
