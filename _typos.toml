# Repo-root typos config for the template's own `prek run` (its CI renders the
# template and lints the output instead of running prek here). Scoped to the
# root, outside `template/`, so generated projects are unaffected.
#
# `CPY` is a ruff rule code (flake8-copyright) in the ruff `ignore` list in
# template/pyproject.toml.jinja; `datas` is the PyInstaller `Analysis(datas=...)`
# / `a.datas` field in the freezer spec template. typos misreads both (CPY as
# COPY/CPU, datas as data) and — because the hook auto-writes fixes — would
# rewrite them, so they must be allowlisted here too.
[default.extend-identifiers]
CPY = "CPY"
datas = "datas"

# `alls-green` is the `re-actors/alls-green` GitHub Action (used as the CI
# aggregation gate); typos splits it on the hyphen and misreads the `alls`
# word as `all`/`falls`. Allowlist the word so the hook does not rewrite it.
[default.extend-words]
alls = "alls"

# Excluded paths:
# - `skills/` holds vendored Claude Code plugin skill documentation (SKILL.md)
#   that mirrors an externally-maintained skill. It is dense with tool names,
#   CLI flags, and intentional hyphenated compounds (`mis-computes`, `mis-bumps`)
#   that typos splits and misreads.
# - `CHANGELOG.md` is release-please-generated (linguist-generated); it is full
#   of abbreviated commit SHAs (e.g. `ba23412`) that typos misreads as words.
# The typos hook auto-writes fixes, so both must be excluded to keep it from
# rewriting generated/vendored content.
[files]
extend-exclude = ["skills/", "CHANGELOG.md"]
