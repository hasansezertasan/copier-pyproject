---
_subdirectory: template
# No `_tasks`: defining any task marks the template "unsafe", which forces
# `copier ... --trust`. The hosted Mend Renovate App runs `copier update` with
# scripts disabled (no `--trust`), so a task-bearing template would break
# Renovate's copier manager — the mechanism that opens template-update PRs in
# generated projects (ADR-015). Keeping `_tasks` empty lets Renovate update
# untrusted, at the cost of not auto-`git init`-ing on the initial copy (the
# after-copy message tells the user to run `git init`).

_message_before_copy: >-
  Pick a preset, then press Enter through the toggles to accept its defaults, or tune any of them. The preset only sets defaults — every toggle is still asked and saved (a few sub-questions stay conditional on their parent toggle).
_message_after_copy: >-
  Project {{ github_repo_name }} scaffolded. Next steps: (1) git init && git add -A && git commit -m "chore: initial commit" (2) uv sync (3) complete the one-time repository setup documented in docs/maintaining/setup.rst (squash-merge policy, workflow permissions, PyPI trusted publishing).
# ── ① Identity ──────────────────────────────────────────────────────────────
github_user:
  type: str
  help: The GitHub username
github_repo_name:
  type: str  # Used verbatim as the importable Python package name.
  help: An awesome project needs an awesome name. Tell me yours.
  validator: >-
    {% if not (github_repo_name | regex_search('^[a-z][a-z0-9_]*$')) %} github_repo_name must be a valid Python package name: lowercase, start with a letter, and contain only letters, digits, and underscores. It is used verbatim as the package/import name (src/<name>/, `from <name> import ...`) and the project name, so dashes are not allowed. {% elif github_repo_name in ["and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "nonlocal", "not", "or", "pass", "raise", "return", "try", "while", "with", "yield"] %} github_repo_name cannot be the Python reserved keyword "{{ github_repo_name }}" — it is used verbatim as the import package name, so `from {{ github_repo_name }} import ...` would be a SyntaxError. Choose a different name. {% endif %}
author_full_name:
  type: str
  help: The full name of the author
author_given_names:
  type: str
  default: "{{ author_full_name.split(' ')[:-1] | join(' ') }}"
  help: >-
    The author's given (first) names, used in CITATION.cff. Defaults to a best-effort split of the full name — correct it here for compound surnames or "Last, First" ordering.
author_family_names:
  type: str
  default: "{{ author_full_name.split(' ')[-1] }}"
  help: The author's family (last) name, used in CITATION.cff.
author_email:
  type: str
  help: The email of the author
short_description:
  type: str
  default: A Python project template.
  help: A short description of the project
package_keywords:
  type: str
  default: ""
  help: >-
    Extra PyPI keywords specific to your project (comma-separated, e.g. "data, async, etl"). Tooling and component keywords are added automatically.
# ── ② Preset ────────────────────────────────────────────────────────────────
preset:
  type: str
  default: library
  choices:
    "Library — pure importable package": library
    "Tool — CLI/TUI app distributed on PyPI": tool
    "Web — web app with database + cache": web
    "Full — every component & integration": full
  help: >-
    Pick a starting point matching your project's shape. The preset just chooses smart defaults you can accept by pressing Enter; every toggle is still asked and saved (a few sub-questions remain conditional on their parent toggle).
preset_map:
  type: yaml
  when: false
  default:
    library:
      - include_docs
      - include_examples
    tool:
      - include_docs
      - include_cli
      - include_tui
      - include_pydantic_settings
    web:
      - include_docs
      - include_web
      - include_pydantic_settings
      - include_postgres
      - include_redis
    full:
      - include_docs
      - include_cli
      - include_web
      - include_gui
      - include_tui
      - include_mcp
      - include_worker
      - include_c_extensions
      - include_profiling
      - include_examples
      - include_launcher
      - include_compiler
      - include_freezer
      - include_pydantic_settings
      - include_sourcery
      - include_sonarcloud
      - include_all_contributors
      - include_smokeshow
      - include_megalinter
      - include_repo_settings
      - include_repo_ruleset
      - include_postgres
      - include_pgadmin
      - include_adminer
      - include_redis
      - include_dbeaver
      - include_vpn
      - include_homebrew
      - include_scoop
# ── ③ Interfaces ────────────────────────────────────────────────────────────
include_cli:
  type: bool
  default: "{{ 'include_cli' in preset_map[preset] }}"
  help: "Include CLI (Command Line Interface)?"
cli_framework:
  type: str
  default: typer
  choices:
    - typer
    - argparse
  when: "{{ include_cli }}"
  help: >-
    Choose the CLI framework. ``typer`` adds a runtime dependency and rich ergonomics; ``argparse`` is standard-library only (no extra dependency) for a lean command root that still exposes the same ``version``/``info`` commands and component subcommands.
include_web:
  type: bool
  default: "{{ 'include_web' in preset_map[preset] }}"
  help: "Include Web API?"
web_framework:
  type: str
  default: fastapi
  choices:
    - fastapi
    - litestar
  when: "{{ include_web }}"
  help: "Choose the web framework to use"
include_gui:
  type: bool
  default: "{{ 'include_gui' in preset_map[preset] }}"
  help: "Include GUI (Graphical User Interface) using Tkinter?"
include_tui:
  type: bool
  default: "{{ 'include_tui' in preset_map[preset] }}"
  help: "Include TUI (Terminal User Interface) using Textual?"
include_mcp:
  type: bool
  default: "{{ 'include_mcp' in preset_map[preset] }}"
  help: "Include MCP (Model Context Protocol) server support?"
include_worker:
  type: bool
  default: "{{ 'include_worker' in preset_map[preset] }}"
  help: "Include message queue worker using FastStream?"
worker_broker:
  type: str
  default: kafka
  choices:
    - kafka
    - nats
    - rabbitmq
    - redis
  when: "{{ include_worker }}"
  help: "Choose the message broker to use"
# ── ④ Packaging / build ─────────────────────────────────────────────────────
include_c_extensions:
  type: bool
  default: "{{ 'include_c_extensions' in preset_map[preset] }}"
  help: "Include C extensions support using Cython?"
include_profiling:
  type: bool
  default: "{{ 'include_profiling' in preset_map[preset] }}"
  help: "Include profiling and performance tools (py-spy, scalene, cProfile)?"
include_launcher:
  type: bool
  default: "{{ 'include_launcher' in preset_map[preset] }}"
  help: "Include a uv-bootstrap launcher (PyCrucible) for a small online-first-run executable?"
include_compiler:
  type: bool
  default: "{{ 'include_compiler' in preset_map[preset] }}"
  help: "Include a compiler (Nuitka) to build a compiled native executable?"
include_freezer:
  type: bool
  default: "{{ 'include_freezer' in preset_map[preset] }}"
  help: "Include an offline freezer (PyInstaller) for a self-contained bundled executable?"
include_examples:
  type: bool
  default: "{{ 'include_examples' in preset_map[preset] }}"
  help: "Include an examples/ folder with simple and advanced usage stubs?"
include_docs:
  type: bool
  default: "{{ 'include_docs' in preset_map[preset] }}"
  help: >-
    Generate a Sphinx documentation site (docs/ tree, docs-build/docs-server/docs-linkcheck tox envs, the docs-preview + weekly docs-linkcheck workflows, and the release Pages deploy)? Off disables the Sphinx site for a README-only project; the maintainer setup guide (docs/maintaining/setup.rst) still ships.
docs_version_granularity:
  type: str
  default: minor
  when: "{{ include_docs }}"
  choices:
    "By minor line (X.Y) — recommended for pre-1.0 (ADR-002 minor = breaking)": minor
    "By major line (X)": major
    "Per full release (X.Y.Z)": full
  help: >-
    At what granularity should published docs be versioned? Each release's docs are deployed under this slug (e.g. 0.3.1 -> "0.3" for minor, "0" for major, "0.3.1" for full), with a `latest` alias tracking the newest release. Only the current release is built each deploy; older versions are preserved from the gh-pages branch. See ADR-027.
# ── ⑤ Config ────────────────────────────────────────────────────────────────
include_pydantic_settings:
  type: bool
  default: "{{ 'include_pydantic_settings' in preset_map[preset] }}"
  help: "Use pydantic-settings for type-safe configuration management?"
# ── ⑥ Quality add-ons (opt-in, may need external accounts) ──────────────────
include_sourcery:
  type: bool
  default: "{{ 'include_sourcery' in preset_map[preset] }}"
  help: >-
    Include a Sourcery config (.sourcery.yaml) for AI refactoring suggestions? Requires installing the Sourcery GitHub App on the repository.
include_sonarcloud:
  type: bool
  default: "{{ 'include_sonarcloud' in preset_map[preset] }}"
  help: >-
    Include SonarCloud static analysis (sonar-project.properties + a CI job)? Requires a SonarCloud organization and a SONAR_TOKEN repository secret.
include_all_contributors:
  type: bool
  default: "{{ 'include_all_contributors' in preset_map[preset] }}"
  help: >-
    Include an all-contributors config (.all-contributorsrc) and a README section? Requires the all-contributors bot/CLI to maintain the list.
include_smokeshow:
  type: bool
  default: "{{ 'include_smokeshow' in preset_map[preset] }}"
  help: >-
    Publish the combined coverage HTML report to a tokenless ephemeral URL via smokeshow (public repos only), in the coverage-combine CI job? No account or secret required. Off by default to preserve the self-contained default; Codecov remains the primary coverage host.
include_megalinter:
  type: bool
  default: "{{ 'include_megalinter' in preset_map[preset] }}"
  help: >-
    Add MegaLinter as an optional extra CI quality layer? It runs only linters that prek/tox do not already cover (shellcheck, hadolint, jsonlint, jscpd clone-detection, and a .md-scoped cspell prose pass) and uploads SARIF findings to the Security tab. Off by default so the fast, self-contained default is preserved (tox/prek remain the canonical runners).
include_repo_settings:
  type: bool
  default: "{{ 'include_repo_settings' in preset_map[preset] }}"
  help: >-
    Include a .github/settings.yml that syncs repository metadata (description, homepage, topics) via the "Settings" GitHub App? Requires installing that App on the repository; it escalates push access to admin, so review the repository-setup note (docs/maintaining/setup.rst) before enabling.
include_repo_ruleset:
  type: bool
  default: "{{ 'include_repo_ruleset' in preset_map[preset] }}"
  help: >-
    Include a repository ruleset (.github/rulesets/main.json) plus an App-free ruleset-sync.yml workflow that enforces branch protection on the default branch as code (squash-only, linear history, required CI checks)? Requires a one-time REPO_ADMIN_TOKEN secret — a fine-grained PAT with Administration read & write (the Actions GITHUB_TOKEN cannot manage rulesets). Manual edits in the web UI are reverted on the next default-branch push. See the repository-setup guide (docs/maintaining/setup.rst) before enabling.
repository_topics:
  type: str
  default: ""
  when: "{{ include_repo_settings }}"
  help: >-
    GitHub repository topics for the "About" sidebar (comma-separated, e.g. "python, cli, automation"). Leave empty to leave the repository's existing topics untouched. The template only lower-cases and hyphenates them; keep them within GitHub's rules (letters/digits/hyphens, <=50 chars each, <=20 total), which are not enforced.
# ── ⑦ Devcontainer services ─────────────────────────────────────────────────
include_postgres:
  type: bool
  default: "{{ 'include_postgres' in preset_map[preset] }}"
  help: "Include PostgreSQL database service in devcontainer?"
include_pgadmin:
  type: bool
  default: "{{ 'include_pgadmin' in preset_map[preset] }}"
  when: "{{ include_postgres }}"
  help: "Include pgAdmin for PostgreSQL management (gated behind 'tools' compose profile)?"
include_adminer:
  type: bool
  default: "{{ 'include_adminer' in preset_map[preset] }}"
  when: "{{ include_postgres }}"
  help: "Include Adminer for database management (gated behind 'tools' compose profile)?"
include_redis:
  type: bool
  default: "{{ 'include_redis' in preset_map[preset] }}"
  help: "Include Redis/Valkey cache service in devcontainer?"
redis_backend:
  type: str
  default: redis
  choices:
    - redis
    - valkey
  when: "{{ include_redis or (include_worker and worker_broker == 'redis') }}"
  help: "Choose the Redis-compatible backend image (redis or valkey)"
include_dbeaver:
  type: bool
  default: "{{ 'include_dbeaver' in preset_map[preset] }}"
  help: "Include DBeaver CloudBeaver for database management (gated behind 'tools' compose profile)?"
include_vpn:
  type: bool
  default: "{{ 'include_vpn' in preset_map[preset] }}"
  help: "Include OpenVPN client in devcontainer?"
# ── Computed helpers (never asked or stored) ─────────────────────────────────
# Single source of truth for the Redis-compatible image and its CLI, derived from
# `redis_backend`. Consumed by both the devcontainer compose service and the CI
# `services:` container for a redis worker, so the two can never drift on an
# image bump. No `redis_enabled` gate is needed: `redis_backend` falls back to
# its `redis` default whenever the question is not asked, so `== 'valkey'` is
# only ever true when the user was actually asked and chose valkey.
redis_image:
  type: str
  when: false
  default: "{{ 'valkey/valkey:8' if redis_backend == 'valkey' else 'redis:7' }}"
redis_cli:
  type: str
  when: false
  default: "{{ 'valkey-cli' if redis_backend == 'valkey' else 'redis-cli' }}"
# Single source of truth for the per-broker facts derived from `worker_broker`:
# the import module, the broker/test-broker class names, and the env var +
# default URL for the local (non-container) connection default. The mapping is
# not mechanical (e.g. `rabbitmq` -> `RabbitBroker` / `faststream.rabbit`, not a
# naive `capitalize`), so it is resolved exactly once here; templates read
# fields off `worker_broker_spec` instead of re-spelling a per-broker
# `{% if worker_broker == ... %}` chain (see ADR note in issue #166). Empty when
# the worker is not enabled. Must not be named with a leading underscore — a
# `when: false` question whose name starts with `_` renders empty in Copier.
#
# `ci_service` carries the *CI mechanism* for the worker integration job
# (ADR-008, issue #169): present for the brokers that run against a runner-
# provided GitHub Actions `services:` container (`image`, `port`, `health_cmd`,
# `url`), absent for the brokers that stay on in-test testcontainers. `ci.yml`
# derives the whole block — and its presence — from this field, so the
# services/testcontainers split lives here and nowhere else. `health_cmd: null`
# means the image ships no usable health probe and readiness is covered by the
# integration test's own connect-retry (see the nats note in ADR-008). `url` is
# the value bound to `env`, always via the published host port on `localhost`.
worker_broker_spec:
  type: json
  when: false
  # A literal block scalar (`|-`), not folded (`>-`), and deliberately so: the
  # continuation lines below are *more indented* than the opening `{{`, which
  # makes a folded scalar's round-trip non-idempotent — yamlfmt re-emits it with
  # a disambiguating blank line, which re-parses into another one, so every hook
  # run appended one more. `|-` has no folding ambiguity and yields a
  # byte-identical value (Jinja ignores the internal newlines either way).
  default: |-
    {{
      (
        {
          "kafka": {"module": "faststream.kafka", "cls": "KafkaBroker", "test_cls": "TestKafkaBroker", "env": "KAFKA_BOOTSTRAP_SERVERS", "default_url": "localhost:9092"},
          "nats": {"module": "faststream.nats", "cls": "NatsBroker", "test_cls": "TestNatsBroker", "env": "NATS_URL", "default_url": "nats://localhost:4222", "ci_service": {"name": "nats", "image": "nats:2.10", "port": 4222, "health_cmd": none, "url": "nats://localhost:4222"}},
          "rabbitmq": {"module": "faststream.rabbit", "cls": "RabbitBroker", "test_cls": "TestRabbitBroker", "env": "RABBITMQ_URL", "default_url": "amqp://guest:guest@localhost:5672/"},
          "redis": {"module": "faststream.redis", "cls": "RedisBroker", "test_cls": "TestRedisBroker", "env": "REDIS_URL", "default_url": "redis://localhost:6379", "ci_service": {"name": "redis", "image": redis_image, "port": 6379, "health_cmd": redis_cli ~ " ping", "url": "redis://localhost:6379"}}
        }[worker_broker] if include_worker else {}
      ) | tojson
    }}
# Single source of truth for the console-script wiring rule. The highest-
# precedence enabled runnable component (CLI > GUI > TUI > web > MCP > worker) is
# the "primary": it owns the bare ``{{github_repo_name}}`` command. Every other
# enabled component is exposed as a *subcommand* of the ``{{github_repo_name}}``
# Typer root (``{{github_repo_name}} <name>``), not a separate ``-<name>``
# console script (see ADR-019). Templates (pyproject, docs, launch.json, tox)
# derive both the primary and each subcommand from these, so the precedence order
# lives here and nowhere else — a component X is a subcommand exactly when
# ``primary_component != "X"``.
primary_component:
  type: str
  when: false
  default: "{% if include_cli %}cli{% elif include_gui %}gui{% elif include_tui %}tui{% elif include_web %}web{% elif include_mcp %}mcp{% elif include_worker %}worker{% endif %}"
# True when the project has a ``{{github_repo_name}}`` Typer root that hosts the
# component subcommands: whenever the CLI is enabled (CLI is always the primary),
# or — with no CLI — whenever ≥2 runnable components need a shared launcher. A
# single-component non-CLI app has no root (bare ``{{github_repo_name}}`` launches
# that component directly) and never pulls in ``typer``. Consumed by the ``cli``
# package/test guards, the ``typer`` dependency, the import-linter ``cli`` layer,
# and ``__main__.py``. See ADR-019.
include_console_root:
  type: bool
  when: false
  default: "{{ include_cli or ([include_gui, include_tui, include_web, include_mcp, include_worker] | select | list | length >= 2) }}"
# The components the console root reaches by *lazy* import: every enabled
# runnable component that is not the primary (ADR-019). Derived from
# `primary_component`, so the precedence still lives in exactly one place.
# Consumed by `cli/app.py` and its test module, which must agree on whether the
# component-dependency guard is emitted at all — previously each re-spelled this
# list in a Jinja header kept in sync only by a comment.
launcher_components:
  type: json
  when: false
  default: "{{ (['tui' if include_tui and primary_component != 'tui' else none, 'gui' if include_gui and primary_component != 'gui' else none, 'web' if include_web and primary_component != 'web' else none, 'mcp' if include_mcp and primary_component != 'mcp' else none, 'worker' if include_worker and primary_component != 'worker' else none] | select | list) | tojson }}"
# True when `cli/app.py` lazy-imports at least one component and therefore
# defines the component-dependency guard: whenever there is a non-primary
# component to launch, or — with no `include_cli` — because the minimal
# launcher's default callback lazy-imports the primary component itself.
# A CLI-only project renders no guard at all.
need_import_guard:
  type: bool
  when: false
  default: "{{ include_console_root and (launcher_components | length > 0 or not include_cli) }}"
# The components the console root actually launches: the non-primary ones as
# subcommands, plus -- in a minimal launcher (no `include_cli`) -- the primary
# one, which the default callback lazy-imports itself.
launched_components:
  type: json
  when: false
  default: "{{ ((launcher_components + ([primary_component] if not include_cli else [])) if include_console_root else []) | tojson }}"
# Human label per component, so a launcher subcommand and the default callback
# cannot disagree on how a component names itself in an error message.
component_label:
  type: json
  when: false
  default: "{{ {'cli': 'CLI', 'tui': 'TUI', 'gui': 'GUI', 'web': 'web', 'mcp': 'MCP', 'worker': 'worker'} | tojson }}"
# A map of component name -> list of dependency modules to import eagerly before
# the component's entrypoint runs. Needed where:
#   * `tui` — textual is only imported when the App mounts (after the guarded
#     block has closed).
#   * `gui` — tkinter is only imported when the window is created (after the
#     guarded block has closed).
#   * `web` — uvicorn is only imported at server run-time (after the guarded
#     block has closed), and the web framework itself must be preflighted so
#     nested failures (e.g. starlette) are normalized.
#   * `worker` — `faststream.<broker>` is a guarded re-export that raises a plain,
#     *nameless* `ImportError` when the broker extra is absent, which exact-name
#     matching can never classify.
# `mcp` is deliberately absent: `mcp.app` imports `mcp` at module scope, so the
# guarded import already reports it by name.
component_preflight:
  type: json
  when: false
  default: "{{ (({'tui': ['textual']} if include_tui else {}) | combine({'gui': ['tkinter']} if include_gui else {}) | combine({'web': [web_framework, 'uvicorn']} if include_web else {}) | combine({'worker': [worker_broker_spec.module]} if include_worker else {})) | tojson }}"
# The launched components that need their preflight rendered — `launched_components`
# minus the ones with no entry in `component_preflight` (only `mcp` today).
# Consumed by `cli/app.py` (whether to emit `_preflight` and import `importlib`)
# and by its test module (which preflight regressions to render).
preflight_used:
  type: json
  when: false
  default: "{{ (['tui' if 'tui' in launched_components else none, 'gui' if 'gui' in launched_components else none, 'web' if 'web' in launched_components else none, 'worker' if 'worker' in launched_components else none] | select | list) | tojson }}"
# True when the console root is the *Typer* root rather than the standard-library
# argparse one. `cli_framework` is only asked when `include_cli`, but a stored
# `argparse` answer is **retained** across a `copier update` that turns the CLI
# off while ≥2 non-CLI components keep the shared launcher — so
# `cli_framework == "typer"` is NOT a safe proxy for "the root imports typer".
# It was one, and the mismatch shipped a project whose launcher imported `typer`
# while `[project] dependencies` never declared it: broken at launch even in a
# fully synced environment, with the guard recommending a `uv sync` that could
# not help. Single source for the `cli/app.py` branch, the `typer` runtime
# dependency in `pyproject.toml`, and `root_dependencies` above — these three
# must agree.
root_uses_typer:
  type: bool
  when: false
  default: "{{ include_console_root and not (include_cli and cli_framework == 'argparse') }}"
# Third-party modules the console root imports at *module scope*, before the
# component-dependency guard inside `cli/app.py` can run:
#   * `typer` — the root itself, unless an explicit `include_cli` + `argparse`
#     choice makes the root standard-library only.
#   * `pydantic` / `pydantic_settings` — pulled in transitively by
#     `core.logging_setup` -> `core.config` when `include_pydantic_settings`.
# `__main__.py` emits its `_load_console_root` guard exactly when this is
# non-empty, and `tests/test_main.py` parametrizes over the same list.
root_dependencies:
  type: json
  when: false
  default: "{{ (((['typer'] if root_uses_typer else []) + (['pydantic', 'pydantic_settings'] if include_pydantic_settings else [])) if include_console_root else []) | tojson }}"
# Single source of truth for which prebuilt binary the brew/scoop packaging
# references when several executable toggles are enabled. Precedence
# freezer > compiler > launcher (freezer/compiler are self-contained; launcher
# needs network on first run). Empty ⇒ no executable toggle ⇒ PyPI fallback.
primary_executable:
  type: str
  when: false
  default: "{% if include_freezer %}freezer{% elif include_compiler %}compiler{% elif include_launcher %}launcher{% endif %}"
# True when any runnable component is enabled — the project is a standalone
# application (installed as a tool) rather than a library (added as a dependency).
is_app:
  type: bool
  when: false
  default: "{{ include_cli or include_gui or include_tui or include_web or include_mcp or include_worker }}"
# ── ⑧ Distribution (opt-in; publishes to a separate tap/bucket repo) ─────────
include_homebrew:
  type: bool
  default: "{{ 'include_homebrew' in preset_map[preset] }}"
  when: "{{ is_app }}"
  help: >-
    Publish a Homebrew tap formula on each release? Requires a homebrew-tap repo under your account and a HOMEBREW_TAP_TOKEN secret (one-time setup, documented in docs/maintaining/setup.rst).
include_scoop:
  type: bool
  default: "{{ 'include_scoop' in preset_map[preset] }}"
  when: "{{ is_app }}"
  help: >-
    Publish a Scoop bucket manifest on each release? Requires a scoop-bucket repo under your account and a SCOOP_BUCKET_TOKEN secret (one-time setup, documented in docs/maintaining/setup.rst). Best paired with an executable toggle (Scoop favors binaries).
