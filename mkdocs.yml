---
# Documentation site for copier-pyproject, published to GitHub Pages by
# .github/workflows/docs.yml together with the Keep the Why dashboard
# on /dashboard/live/.
#
# The pages come from where they already live: docs/*.md and the frozen ADR
# archive in docs/adr/ as they are, README.md as the home page and context/*.md
# as "Why it is built this way" (both generated at build time by
# tools/mkdocs/site_pages.py, no copies).
#
# Local preview, with the versions .github/workflows/docs.yml builds with:
#   uvx --from mkdocs==1.6.1 --with mkdocs-material==9.7.7 mkdocs serve
site_name: copier-pyproject
site_description: Copier template for a modern, typed Python package/CLI with uv, hatch, tox, and GitHub automation baked in.
site_url: https://hasansezertasan.github.io/copier-pyproject/
repo_url: https://github.com/hasansezertasan/copier-pyproject
repo_name: hasansezertasan/copier-pyproject
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

hooks:
  - tools/mkdocs/site_pages.py

extra_css:
  - assets/extra.css

# Reached from their indexes, not listed one by one.
not_in_nav: |
  adr/*
  context/*

nav:
  - Home: index.md
  - Guides:
      - Template architecture: template-architecture.md
      - Generated project trees: generated-project-trees.md
      - Generated-project check coverage: hook-coverage.md
      - Template adoption and update audits: template-adoption.md
  - Architecture decision records (archive):
      - ADR index: adr/index.md
  - Why it is built this way:
      - Context index: context/index.md
      - "Dashboard ↗": https://hasansezertasan.github.io/copier-pyproject/dashboard/live/
